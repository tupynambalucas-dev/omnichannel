catalogMode: 'strict'
shellEmulator: true

peerDependencyRules:
  ignoreMissing:
    - eslint-plugin-import
  allowAny:
    - eslint

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msgpackr-extract
  - unrs-resolver

packages:
  - 'core'
  - 'api'

catalog:
  '@types/node': ^26.6.6
  typescript: ^7.0.2
  tsx: ^4.23.15
  rimraf: ^6.1.4
  turbo: ^2.11.11
  kill-port: ^2.0.1
  husky: ^9.1.7
  lint-staged: ^17.5.1

catalogs:
  tooling-stack:
    '@eslint/js': ^10.0.1
    '@typescript-eslint/eslint-plugin': ^8.72.2
    eslint: ^10.15.0
    eslint-config-prettier: ^10.1.8
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-import-x: ^4.18.1
    eslint-plugin-prettier: ^5.5.7
    jiti: ^2.7.0
    prettier: ^3.10.1
    typescript-eslint: ^8.72.2

  shared-stack:
    zod: ^4.6.7

  api-stack:
    '@fastify/cors': ^11.4.3
    '@fastify/env': ^7.0.1
    '@fastify/helmet': ^13.2.0
    '@fastify/one-line-logger': ^2.2.1
    '@fastify/rate-limit': ^11.2.2
    '@sentry/node': ^11.12.0
    '@types/pg': ^8.23.1
    bullmq: ^6.7.6
    fastify: ^5.12.8
    fastify-metrics: ^15.0.1
    fastify-plugin: ^6.0.1
    fastify-type-provider-zod: ^7.0.0
    ioredis: ^6.0.0
    mongoose: ^9.12.1
    pg: ^8.23.1
    pino-roll: ^4.0.0

  # Enterprise Agent Mesh Plugins (git package distribution fallback & registry mirror)
  plugins-stack:
    '@tupynambalucas-dev/agent-mesh': 'github:tupynambalucas-dev/agent-mesh'
    '@tupynambalucas-dev/plugin-appsheet': 'github:tupynambalucas-dev/agent-mesh#path:plugins/packages/appsheet'
    '@tupynambalucas-dev/plugin-atelier': 'github:tupynambalucas-dev/agent-mesh#path:plugins/packages/atelier'
    '@tupynambalucas-dev/plugin-docusaurus': 'github:tupynambalucas-dev/agent-mesh#path:plugins/packages/docusaurus'
    '@tupynambalucas-dev/plugin-github-flow': 'github:tupynambalucas-dev/agent-mesh#path:plugins/packages/github-flow'
    '@tupynambalucas-dev/plugin-github-org': 'github:tupynambalucas-dev/agent-mesh#path:plugins/packages/github-org'
    '@tupynambalucas-dev/plugin-gwork': 'github:tupynambalucas-dev/agent-mesh#path:plugins/packages/gwork'
    '@tupynambalucas-dev/plugin-repo': 'github:tupynambalucas-dev/agent-mesh#path:plugins/packages/repo'
    '@tupynambalucas-dev/plugin-research': 'github:tupynambalucas-dev/agent-mesh#path:plugins/packages/research'
    '@tupynambalucas-dev/plugin-secrets': 'github:tupynambalucas-dev/agent-mesh#path:plugins/packages/secrets'
    '@tupynambalucas-dev/plugin-web': 'github:tupynambalucas-dev/agent-mesh#path:plugins/packages/web'
