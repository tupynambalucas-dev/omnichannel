# cliff.toml - git-cliff configuration for tupynambalucas-dev/omnichannel
# Authoritative Keep a Changelog + Docusaurus Format Specification

[remote.github]
owner = "tupynambalucas-dev"
repo = "omnichannel"

[changelog]
header = """
# Changelog - @tupynambalucas-dev/omnichannel

<!-- changelog-start -->
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
        {%- set raw_first = commit.raw_message | split(pat="\n") | first | trim -%}
        {%- if commit.remote.pr_number -%}
            {%- set clean_msg = raw_first | replace(from=" (#" ~ commit.remote.pr_number ~ ")", to="") -%}
        - [#{{ commit.remote.pr_number }}](https://github.com/tupynambalucas-dev/omnichannel/pull/{{ commit.remote.pr_number }}) {{ clean_msg }}{% if commit.remote.username %} ([@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }})){% endif %}
        {%- else -%}
        - [{{ commit.id | truncate(length=7, end="") }}](https://github.com/tupynambalucas-dev/omnichannel/commit/{{ commit.id }}) {{ raw_first }}{% if commit.remote.username %} ([@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }})){% endif %}
        {%- endif %}
    {% endfor %}
{% endfor -%}
{%- set committers = commits | filter(attribute="remote.username") | group_by(attribute="remote.username") -%}
{%- if committers | length > 0 %}

### Committers: {{ committers | length }}
{% for username, user_commits in committers %}
{%- set last_commit = user_commits | last -%}
- {{ last_commit.author.name }} ([@{{ username }}](https://github.com/{{ username }}))
{% endfor -%}
{%- endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features & Capabilities" },
    { message = "^fix", group = "Bug Fixes & Corrections" },
    { message = "^perf", group = "Performance Optimizations" },
    { message = "^refactor", group = "Refactoring & Internal Architecture" },
    { message = "^docs", group = "Documentation & Specifications" },
    { message = "^security", group = "Security & Vulnerability Patches" },
    { message = "^revert", group = "Reverts & Rollbacks" },
    { message = "^chore\\(deps.*\\)", group = "Dependencies" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^(chore|build|ci|test)", group = "Maintenance" },
    { message = "^style", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
